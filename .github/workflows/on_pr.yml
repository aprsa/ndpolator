name: ndpolator CI

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - 'main'

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
                os: [ubuntu-24.04, ubuntu-26.04, macos-15, macos-26, windows-2022, windows-2025]

        name: ${{ matrix.os }} python ${{ matrix.python-version }}
        steps:
            - name: checkout ndpolator
              uses: actions/checkout@v7

            - name: setup python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                python-version: ${{ matrix.python-version }}
                cache: 'pip'
                cache-dependency-path: |
                    requirements*.txt
                    setup.py
                    pyproject.toml

            - name: upgrade pip tooling
              run: python -m pip install --upgrade pip setuptools wheel pytest build

            - name: install ndpolator
              env:
                NDPOLATOR_WERROR: "1"  # treat compiler warnings as errors in CI
              run: pip install .

            - name: run tests
              run: pytest --verbose tests
