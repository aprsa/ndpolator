name: Upload ndpolator to pypi on release

on:
    workflow_dispatch:
    pull_request:
    release:
        types: [created]

jobs:
    build-sdist:
        name: Package source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Build sdist tarball
              run: |
                pipx run build --sdist
            - uses: actions/upload-artifact@v7
              with:
                name: cibw-sdist
                path: dist/*.tar.gz

    build-wheels:
        name: Build wheels on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-2025"]') || fromJSON('["ubuntu-26.04", "macos-26", "windows-2025"]') }}
        steps:
            - name: Checkout the sources
              uses: actions/checkout@v7
            - name: Build wheels
              uses: pypa/cibuildwheel@v4.3.5
              env:
                CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
                CIBW_SKIP: "*-win32 *_i686"
                CIBW_ENVIRONMENT: "NDPOLATOR_WERROR=1"  # treat compiler warnings as errors in CI
                CIBW_ARCHS_MACOS: "x86_64 arm64"
                CIBW_TEST_REQUIRES: "pytest"
                CIBW_TEST_COMMAND: "pytest {project}/tests"
            - uses: actions/upload-artifact@v7
              with:
                name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                path: ./wheelhouse/*.whl

    publish-to-pypi:
        if: github.event_name == 'release'
        needs: [build-sdist, build-wheels]
        name: Publish release to PyPI
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/ndpolator
        permissions:
            id-token: write
        steps:
            - name: Gather sdist tarball and wheels
              uses: actions/download-artifact@v8
              with:
                pattern: cibw-*
                path: dist
                merge-multiple: true
            - name: Publish package distributions to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
